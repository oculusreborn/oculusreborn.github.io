  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Store",
    "name": "Oculus Reborn",
    "description": "Oculus Reborn - Catálogo de productos. Consulta por WhatsApp.",
    "image": "img/preview.png",
    "url": "",
    "telephone": "+",
    "areaServed": "",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "",
      "addressRegion": "",
      "addressCountry": ""
    }
  }

<body>

  <header class="navbar">
    <a href="/" class="navbar__logo" aria-label="Inicio">
      <img src="img/logo.png" alt="Oculus Reborn" class="navbar__logo-img">
    </a>

    <form class="navbar__busqueda" id="busqueda-form">
      <input
        type="text"
        id="busqueda-input"
        placeholder="Buscar productos..."
        autocomplete="off"
        aria-label="Buscar productos"
      >
      <button type="submit" aria-label="Buscar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
      </button>
    </form>

    <button class="navbar__carrito" onclick="abrirCarrito()" aria-label="Ver cotización">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="carrito-contador" id="carrito-contador">0</span>
    </button>

    <button class="navbar__menu-btn" onclick="toggleMenuMovil()" aria-label="Menú">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="24" height="24">
        <path d="M3 12h18M3 6h18M3 18h18"/>
      </svg>
    </button>
  </header>

  <nav class="categorias-bar" id="categorias-desktop" aria-label="Categorías"></nav>

  <nav class="menu-movil" id="menu-movil" aria-label="Menú de categorías">
    <div class="menu-movil__header">
      <span class="menu-movil__titulo">Categorías</span>
      <button class="menu-movil__cerrar" onclick="cerrarMenuMovil()" aria-label="Cerrar menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="26" height="26">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="menu-movil__lista" id="categorias-movil"></div>
  </nav>

  <section class="carrusel" aria-label="Promociones">

    <div class="carrusel__track" id="carrusel-track"></div>

    <button class="carrusel__nav carrusel__nav--prev" id="carrusel-prev" aria-label="Banner anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20" height="20"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="carrusel__nav carrusel__nav--next" id="carrusel-next" aria-label="Banner siguiente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20" height="20"><path d="M9 18l6-6-6-6"/></svg>
    </button>

    <div class="carrusel__dots" id="carrusel-dots"></div>
  </section>

  <main class="main">

    <section class="destacados" id="seccion-destacados" style="display:none;">
      <div class="destacados__header">
        <h2 class="destacados__titulo">🔥 Ofertas Especiales</h2>
        <div class="destacados__nav">
          <button class="destacados__flecha" id="destacados-prev" aria-label="Anterior">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20" height="20"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button class="destacados__flecha" id="destacados-next" aria-label="Siguiente">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20" height="20"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
      </div>
      <div class="destacados-track" id="destacados-grid"></div>
    </section>

    <section>
      <div class="filtros-bar">
        <h2 class="seccion-titulo" id="titulo-catalogo" style="margin:0; flex:1;">Todos los Productos</h2>
        <p class="filtros-bar__info">Mostrando <span id="contador-productos">0</span> productos</p>
      </div>
      <div class="productos-grid" id="productos-grid">
        <div class="loading"><div class="spinner"></div><span>Cargando productos...</span></div>
      </div>
      <nav class="paginacion" id="paginacion" aria-label="Paginación"></nav>
    </section>

  </main>

  <section class="sucursales" id="encuentranos" style="display:none;">
    <div class="sucursales__inner">
      <h2 class="seccion-titulo">📍 Encuéntranos</h2>

      <div class="sucursales__layout">
        <select class="sucursales__select" id="sucursales-select" aria-label="Elegir sucursal"></select>

        <div class="sucursales__lista" id="sucursales-lista"></div>

        <div class="sucursales__mapa">
          <iframe
            id="mapa-sucursal"
            src=""
            style="border:0; display:block; width:100%; height:100%;"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            title="Ubicación de sucursal">
          </iframe>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">

    <div class="footer__grid">
      <div class="footer__marca">
        <h3>Oculus Reborn</h3>
      </div>

      <div class="footer__rrss">
        <h4>Sígueme</h4>
        <a href="https://www.instagram.com/oculu5reborn" target="_blank" aria-label="Sígueme">
          <svg viewBox="0 0 32 32" fill="currentColor">
            <path d="M16 12a4 4 0 1 0-1.172 2.829A3.84 3.84 0 0 0 16 12.06l-.001-.063zm2.16 0a6.135 6.135 0 1 1-1.797-4.359 5.92 5.92 0 0 1 1.798 4.256l-.001.109zm1.687-6.406v.002a1.44 1.44 0 1 1-.422-1.018c.256.251.415.601.415.988v.029-.001zm-7.84-3.44-1.195-.008q-1.086-.008-1.649 0t-1.508.047c-.585.02-1.14.078-1.683.17l.073-.01c-.425.07-.802.17-1.163.303l.043-.014a4.12 4.12 0 0 0-2.272 2.254l-.01.027a6 6 0 0 0-.284 1.083l-.005.037a12 12 0 0 0-.159 1.589l-.001.021q-.039.946-.047 1.508t0 1.649.008 1.195-.008 1.195 0 1.649.047 1.508c.02.585.078 1.14.17 1.683l-.01-.073c.07.425.17.802.303 1.163l-.014-.043a4.12 4.12 0 0 0 2.254 2.272l.027.01c.318.119.695.219 1.083.284l.037.005c.469.082 1.024.14 1.588.159l.021.001q.946.039 1.508.047t1.649 0l1.188-.024 1.195.008q1.086.008 1.649 0t1.508-.047c.585-.02 1.14-.078 1.683-.17l-.073.01c.425-.07.802-.17 1.163-.303l-.043.014a4.12 4.12 0 0 0 2.272-2.254l.01-.027c.119-.318.219-.695.284-1.083l.005-.037c.082-.469.14-1.024.159-1.588l.001-.021q.039-.946.047-1.508t0-1.649-.008-1.195.008-1.195 0-1.649-.047-1.508c-.02-.585-.078-1.14-.17-1.683l.01.073a6.3 6.3 0 0 0-.303-1.163l.014.043a4.12 4.12 0 0 0-2.254-2.272l-.027-.01a6 6 0 0 0-1.083-.284l-.037-.005a12 12 0 0 0-1.588-.159l-.021-.001q-.946-.039-1.508-.047t-1.649 0zM24 12q0 3.578-.08 4.953a6.64 6.64 0 0 1-6.985 6.968l.016.001q-1.375.08-4.953.08t-4.953-.08a6.64 6.64 0 0 1-6.968-6.985l-.001.016q-.08-1.375-.08-4.953t.08-4.953A6.64 6.64 0 0 1 7.061.079L7.045.078q1.375-.08 4.953-.08t4.953.08a6.64 6.64 0 0 1 6.968 6.985l.001-.016Q24 8.421 24 12"/>
          </svg>
        </a>
      </div>

    </div>
 
    <div class="footer__bottom">
      <span>© 2026 - Oculus Reborn - Todos los derechos reservados</span>
    </div>
  </footer>

  <a href="https://wa.me/573015636533" target="_blank" class="whatsapp-float js-wa-link" aria-label="Contactar por WhatsApp">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>

  </a>
